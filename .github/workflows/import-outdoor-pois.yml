name: OSM-POIs importieren

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-pois:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Osmium installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y osmium-tool
      - name: OSM-Rohdaten herunterladen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp data/pois
          python3 tools/download_osm.py --region tuebingen --output tmp/tuebingen.osm.pbf
          python3 tools/download_osm.py --region schwaben --output tmp/schwaben.osm.pbf
          osmium fileinfo -e tmp/tuebingen.osm.pbf
          osmium fileinfo -e tmp/schwaben.osm.pbf
      - name: OSM-Testgebiet Ulm / Neu-Ulm ausschneiden
        shell: bash
        run: |
          set -euo pipefail
          osmium merge tmp/tuebingen.osm.pbf tmp/schwaben.osm.pbf -o tmp/merged.osm.pbf -O
          osmium extract -b 9.82,48.27,10.16,48.53 --strategy=smart \
            tmp/merged.osm.pbf -o tmp/ulm.osm.pbf -O
      - name: Outdoor-POIs aus OSM extrahieren
        shell: bash
        run: |
          set -euo pipefail
          osmium tags-filter tmp/ulm.osm.pbf \
            'nwr/amenity=shelter,drinking_water,restaurant,cafe,fast_food,bicycle_repair_station,toilets,pharmacy,hospital,clinic,doctors,ferry_terminal' \
            'nwr/shop=supermarket,bakery,bicycle' \
            'nwr/tourism=wilderness_hut,picnic_site,camp_site,hotel,hostel,guest_house,motel,alpine_hut,attraction,viewpoint' \
            'nwr/natural=cave_entrance,rock_overhang,beach' \
            'nwr/shelter_type=rock_shelter' \
            'nwr/leisure=firepit,bathing_place' \
            'nwr/historic=castle,ruins' \
            'nwr/ruins=castle' \
            'nwr/railway=station' \
            -o tmp/outdoor.osm.pbf -O
          osmium export tmp/outdoor.osm.pbf -o tmp/outdoor-raw.geojson \
            -a type,id -O
          python tools/build_outdoor_pois.py \
            --input-geojson tmp/outdoor-raw.geojson \
            --bbox 9.82,48.27,10.16,48.53 \
            --output data/pois/outdoor-test.geojson
      - name: POI-Datei ins Repository speichern
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/pois/outdoor-test.geojson
          if ! git diff --cached --quiet; then
            git commit -m 'Update outdoor POIs from Geofabrik OSM extract'
            git push
          fi
