<!doctype html>
<html lang="de">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="theme-color" content="#111b25">
	<title>Danube Navigator</title>
	<link rel="manifest" href="./manifest.webmanifest">
	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
	<link rel="stylesheet" href="./assets/css/app.css">
</head>
<body>
	<header>
		<div><strong>Danube Navigator</strong><small>Komoot-Referenzroute · Phase 2</small></div>
		<button id="locate" type="button">GPS starten</button>
	</header>
	<main>
		<div id="map" role="application" aria-label="Karte der Donauroute"></div>
		<section id="tour-controls" aria-label="Touraufzeichnung">
			<button id="tour-toggle" type="button">Tour starten</button>
			<button id="tour-reset" type="button">Zurücksetzen</button>
			<span id="tour-state">Tour noch nicht gestartet</span>
		</section>
		<section id="stats">
			<div><span>Gesamtroute</span><strong id="total">–</strong></div>
			<div><span>Tatsächlich gefahren</span><strong id="progress">0.0 km</strong></div>
			<div><span>Routen-km (nächster Punkt)</span><strong id="route-position">–</strong></div>
			<div><span>Rest auf der Route</span><strong id="remaining">–</strong></div>
			<div><span>Abstand zur Route</span><strong id="offroute">–</strong></div>
		</section>
		<p id="status" role="status">Lade Referenzroute …</p>
	</main>
	<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
	<script type="module" src="./assets/js/app.js"></script>
</body>
</html>
